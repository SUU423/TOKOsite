<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>とこサイト</title>
    <link rel="stylesheet" href="style2.css">
    <script src="config.js" defer></script>
    <script src="list.js" defer></script>
    <script src="social.js" defer></script>
    <script src="nav.js" defer></script>

</head>

<body>

    <nav class="social">
        <div class="socialdiv">
            <div class="social1">
                <h1>とこサイト</h1>
            </div>
            <div class="social2">
                <div class="timearea" id="timearea"></div>
            </div>
            <div class="social3">
                <div class="datearea" id="datearea"></div>
                <div class="weatherarea" id="weatherarea"></div>
            </div>
        </div>
    </nav>


    <main>
        <div class="contents">
            <nav class="link">
                <h2>各種リンク</h2>
                <div class="contents1">
                    <div class="linkdiv" id="linkdiv">
                        <a href="https://unipa.tokoha-u.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml" class="link1">
                            <img src="img\UNIPA.png">
                        </a>
                        <a href="https://www.tokoha-u.ac.jp/" class="link2">
                            <img src="img\HP.png">
                        </a>
                    </div>
                    <div class="searchdiv">
                        <form action="https://www.google.com/search" method="GET" target="_blank">
                            <input type="text" name="q" class="search-input" placeholder="Google検索..."
                                autocomplete="off">
                        </form>
                    </div>
                </div>
            </nav>
            <nav class="train">
                <h2>電車運行情報</h2>
                <div class="traindiv" id="traindiv">
                    <div class="jr">
                        <h3>JR草薙駅</h3>
                        <div class="timejr">
                            <div>
                                <h3>静岡方面</h3>
                                <div class="train1" id="train1"></div>
                            </div>
                            <div>
                                <h3>清水方面</h3>
                                <div class="train2" id="train2"></div>
                            </div>
                        </div>
                    </div>
                    <div class="st">
                        <h3>静鉄草薙駅</h3>
                        <div class="timest">
                            <div>
                                <h3>新静岡方面</h3>
                                <div class="train3" id="train3"></div>
                            </div>
                            <div>
                                <h3>新清水方面</h3>
                                <div class="train4" id="train4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
            <nav class="news">
                <h2>最近のトピックス</h2>
                <div class="newsdiv" id="newsdiv">
                </div>
            </nav>

            <nav class="column">
                <h2>面白コラム</h2>
                <div class="columndiv" id="columndiv"></div>
            </nav>

        </div>

    </main>

</body>

</html>
